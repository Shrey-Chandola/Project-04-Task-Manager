<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <header>
            <h1>Task Manager</h1>
            <p>Short Description</p>
        </header>
        <section>
            <form class="new-task">
                <label for="input-task">New Task</label>
                <input id="input-task" type="text" placeholder="What needs to be done?">
                <button id="add-btn">Add</button>
            </form>
            <div class="task-filters">
                <button id="all-btn">All</button>
                <button id="active-btn">Active</button>
                <button id="completed-btn">Completed</button>
            </div>
            <div class="Task-list">
                <h2>Task List</h2>
                <ul id="task-list">
                    <!--js will fill this place-->
                </ul>
            </div>
        </section>
        <footer>
            <p id="task-Count">Task Count</p>
            <button id="clear-completed-btn">Clear Completed</button>
        </footer>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
